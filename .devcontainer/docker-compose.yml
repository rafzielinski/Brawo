services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/brawo_cms_development
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brawo_cms_development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brawo_cms_development"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
